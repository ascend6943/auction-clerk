<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auction Clerk{% endblock %}</title>
  <style>
    :root {
      --navy: #14293f;
      --navy-soft: #294868;
      --gold: #c58a2c;
      --paper: #ffffff;
      --bg: #f4f2ec;
      --line: #d9d6cd;
      --text: #20252b;
      --muted: #6b7280;
      --danger: #a62d2d;
      --success: #256b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    a { color: var(--navy-soft); }
    .topbar {
      background: var(--navy);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 19px; letter-spacing: .3px; }
    .brand span { color: var(--gold); }
    .topnav { display: flex; gap: 18px; align-items: center; }
    .topnav a { color: #e7edf3; text-decoration: none; font-weight: 600; }
    .topnav a:hover { color: white; text-decoration: underline; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { margin: 0 0 4px; font-size: 27px; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    .muted { color: var(--muted); margin-top: 0; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(20, 41, 63, .05);
    }
    .two-col { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat {
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px;
    }
    .stat b { display: block; font-size: 23px; color: var(--navy); }
    .stat small { color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-size: 11px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field-grid .wide { grid-column: 1 / -1; }
    .field { margin-bottom: 12px; }
    .field-grid .field { margin-bottom: 0; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #c5c9ce; border-radius: 6px;
      background: white; color: var(--text); font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid #9db6d0; border-color: var(--navy-soft); }
    small.help { display: block; color: var(--muted); margin-top: 3px; }
    .errors { color: var(--danger); font-size: 13px; margin-top: 3px; }
    .btn {
      display: inline-block; border: 0; border-radius: 6px; padding: 9px 15px;
      background: var(--navy); color: white; font-weight: 600; text-decoration: none;
      cursor: pointer; font: inherit; font-size: 14px;
    }
    .btn:hover { background: var(--navy-soft); }
    .btn.secondary { background: #e6e9ed; color: var(--navy); }
    .btn.secondary:hover { background: #d5dae0; }
    .btn.gold { background: var(--gold); }
    .btn.gold:hover { background: #a97421; }
    .btn.danger { background: var(--danger); }
    .btn.small { padding: 5px 9px; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tabs a {
      padding: 8px 13px; border-radius: 999px; text-decoration: none; font-weight: 600;
      background: white; border: 1px solid var(--line); color: var(--navy);
    }
    .tabs a:hover { border-color: var(--navy-soft); }
    .tabs a.active { background: var(--navy); border-color: var(--navy); color: white; }
    .tabs a.delete { color: var(--danger); border-color: #e4bcbc; }
    .tabs a.delete:hover { background: #f8e3e3; border-color: var(--danger); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    td.num, th.num { text-align: right; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .table-wrap { overflow-x: auto; }
    .row-actions { display: flex; gap: 6px; white-space: nowrap; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.sold { background: #e3f3e9; color: var(--success); }
    .pill.available { background: #edf0f3; color: var(--muted); }
    .messages { margin-bottom: 18px; }
    .message { padding: 10px 13px; border-radius: 6px; margin-bottom: 8px; }
    .message.success { background: #e3f3e9; color: var(--success); }
    .message.error { background: #f8e3e3; color: var(--danger); }
    .empty { color: var(--muted); padding: 14px 0; }
    .event-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
    .invoice {
      background: white; border: 1px solid var(--line); border-radius: 8px;
      padding: 26px; max-width: 820px; margin: 0 auto 24px;
    }
    .invoice-head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid var(--navy); padding-bottom: 12px; margin-bottom: 16px; }
    .invoice-head h2 { margin: 0; font-size: 22px; }
    .invoice-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 22px; margin-bottom: 18px; }
    .invoice-total { text-align: right; font-size: 20px; font-weight: 700; padding-top: 12px; }
    .signature { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); }
    @media print {
      body { background: white; }
      .topbar, .no-print, .footer, .tabs, .messages { display: none !important; }
      .wrap { max-width: none; padding: 0; }
      .invoice { border: 0; border-radius: 0; padding: 0; max-width: none; margin: 0; }
      .page-break { break-after: page; page-break-after: always; }
      .page-break:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">Auction <span>Clerk</span></div>
    <nav class="topnav">
      <a href="{% url 'event_list' %}">Sale events</a>
    </nav>
  </header>
  <main class="wrap">
    {% if messages %}
      <div class="messages no-print">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <div class="footer">Auction Clerk &middot; local network app</div>
  <script>
    (function () {
      document.querySelectorAll("[data-print]").forEach(function (button) {
        button.addEventListener("click", function () { window.print(); });
      });

      document.querySelectorAll("[data-lot-lookup]").forEach(function (input) {
        var form = input.closest("form");
        var list = document.getElementById(input.getAttribute("list"));
        var options = list
          ? Array.prototype.slice.call(list.options).map(function (option) {
              return {
                number: option.value,
                description: option.dataset.description || "",
                quantity: option.dataset.quantity || "1"
              };
            })
          : [];

        var description = form.elements.description;
        var quantity = form.elements.quantity;
        var lastNumber = input.value;
        var autofilled;
        function fillFromCatalog() {
          if (input.value === lastNumber) return;
          lastNumber = input.value;
          var typed = lastNumber.trim().replace(/^0+/, "");
          var match = options.find(function (option) {
            return option.number === typed;
          });
          if (match) {
            description.value = match.description;
            quantity.value = match.quantity;
          } else if (autofilled) {
            if (description.value === autofilled.description) description.value = "";
            if (quantity.value === autofilled.quantity) quantity.value = "";
          }
          autofilled = match;
        }

        input.addEventListener("input", fillFromCatalog);
        input.addEventListener("change", fillFromCatalog);
      });
    })();
  </script>
</body>
</html>
